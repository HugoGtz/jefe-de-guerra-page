<!doctype html>
<html lang="es" class="scroll-smooth">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0a0708" />
		<!-- Icons -->
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="%sveltekit.assets%/icon-192.png" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		%sveltekit.head%
		<!--
			Cloudflare Web Analytics is already live for jefedeguerra.com — no
			script needed here. Because the domain's DNS is proxied through
			Cloudflare (it's a Cloudflare "zone", not just a bare *.pages.dev
			host), Cloudflare collects Web Analytics automatically at the edge
			for every request to that zone. See it at:
				dashboard → Analytics & Logs → Web Analytics → jefedeguerra.com
			No cookies, no consent banner (this is what made the JS-beacon
			approach below unnecessary — it's the classic alternative for sites
			NOT proxied through a Cloudflare zone, kept here only for reference
			in case the domain ever moves off Cloudflare DNS).
		-->
		<!-- <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "PASTE_TOKEN_HERE"}'></script> -->
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-ash text-silver antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
